services:
  mysql:
    image: mysql:8.4
    container_name: gitanalyzer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gitanalyzer
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-prootpassword']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: gitanalyzer-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      GITHUB_API_BASE_URL: https://api.github.com
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: gitanalyzer
      API_PREFIX: /api/v1
      ANALYSIS_CACHE_TTL_MINUTES: 1440
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    container_name: gitanalyzer-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  mysql_data: